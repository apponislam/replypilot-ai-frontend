<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="45%" stop-color="#0e89b8" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Glass Glow Gradient -->
    <radialGradient id="topGlow" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Bubble Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <!-- Plane Shading Gradient -->
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#082f49" flood-opacity="0.35" />
    </filter>
    <filter id="planeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#0c4a6e" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="120" fill="url(#topGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="8" />

  <!-- Inner Content Group with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Main Chat Bubble Body -->
    <path
      d="M110 150 C110 116.86 136.86 90 170 90 L342 90 C375.14 90 402 116.86 402 150 L402 276 C402 309.14 375.14 336 342 336 L210 336 L134 394 C124 402 110 394.8 110 382 L110 336 Z"
      fill="url(#bubbleGrad)"
    />

    <!-- Subtle Bubble Inner Bevel / Reflection -->
    <path
      d="M170 104 L342 104 C367.4 104 388 124.6 388 150 L388 276 C388 288 383 298.8 375 306.6 C381 298 384 287.4 384 276 L384 150 C384 126.8 365.2 108 342 108 L170 108 C158.6 108 148 111 139.4 117 C147.2 109 158 104 170 104 Z"
      fill="#ffffff"
      opacity="0.8"
    />

    <!-- Pilot Send / Supersonic Plane Wing Icon inside the bubble -->
    <g filter="url(#planeShadow)">
      <!-- Main Plane Body (Left Wing) -->
      <path
        d="M344 146 L182 214 C169 220 171 238 184 240 L246 253 L344 146 Z"
        fill="url(#planeBody)"
      />

      <!-- Right Wing -->
      <path
        d="M344 146 L246 253 L259 315 C261 328 279 330 285 317 L353 159 C355 152 351 144 344 146 Z"
        fill="#0284c7"
      />

      <!-- Center Fold Line Highlight -->
      <path
        d="M344 146 L246 253 L265 255 Z"
        fill="#38bdf8"
        opacity="0.95"
      />
    </g>
  </g>
</svg>
